<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annalyn Bachmann</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --paper:#EFF4F1;
    --paper-edge:#E1EAE4;
    --ink:#163A4D;
    --muted:#4E6B67;
    --rule:#C9DAD3;
    --accent:#2E6F5E;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--paper-edge);
    font-family:'Lora',serif;
    color:var(--ink);
    padding:32px 16px;
  }
  .card{
    width:100%;
    max-width:380px;
    background:var(--paper);
    padding:14px;
    border-radius:2px;
  }
  .card-inner{
    border:1px solid var(--accent);
    padding:2px;
  }
  .card-content{
    border:1px solid var(--rule);
    padding:36px 30px 30px;
    text-align:center;
  }
  .name{
    
    font-size:28px;
    font-weight:500;
    letter-spacing:0.01em;
    margin:0;
    line-height:1.2;
  }
  .name-rule{
    width:36px;
    height:1px;
    background:var(--accent);
    margin:16px auto 20px;
  }
  .role-block{
    margin-bottom:18px;
  }
  .role-title{
    font-size:14.5px;
    font-weight:500;
    margin:0 0 2px;
    line-height:1.4;
  }
  .role-org{
    font-size:13px;
    color:var(--muted);
    margin:0 0 6px;
    font-style:italic;
    
  }
  .role-email{
    font-size:12.5px;
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid var(--rule);
    padding-bottom:1px;
  }
  .role-email:hover{
    border-bottom-color:var(--accent);
  }
  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin:20px 0;
  }
  .divider span{
    width:3px;
    height:3px;
    border-radius:50%;
    background:var(--rule);
    display:inline-block;
  }
  .qr-wrap{
    margin-top:22px;
    padding-top:22px;
    border-top:1px solid var(--rule);
  }
  #qrcode{
    display:flex;
    justify-content:center;
    margin-bottom:12px;
  }
  #qrcode img{
    border:6px solid #fff;
  }
  .site-url{
    font-size:12px;
    color:var(--muted);
    margin:0 0 14px;
    word-break:break-all;
  }
  .copy-btn{
    font-family:'Lora',serif;
    font-size:12.5px;
    font-weight:500;
    color:var(--ink);
    background:transparent;
    border:1px solid var(--rule);
    padding:8px 18px;
    cursor:pointer;
    transition:border-color 0.15s, color 0.15s;
  }
  .copy-btn:hover{
    border-color:var(--accent);
    color:var(--accent);
  }
  .copy-btn:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .copy-btn.copied{
    border-color:var(--accent);
    color:var(--accent);
  }
  @media (prefers-reduced-motion: reduce){
    .copy-btn{transition:none;}
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-inner">
    <div class="card-content">
      <p class="name">Annalyn Bachmann</p>
      <div class="name-rule"></div>

      <div class="role-block">
        <p class="role-title">Ph.D. Student, Political Science</p>
        <p class="role-org">Northeastern University</p>
        <a class="role-email" href="mailto:bachmann.a@northeastern.edu">bachmann.a@northeastern.edu</a>
      </div>

      <div class="divider"><span></span><span></span><span></span></div>

      <div class="role-block" style="margin-bottom:0;">
        <p class="role-title">Head of Product, Workforce Learning</p>
        <p class="role-org">MIT Horizon &mdash; MIT</p>
        <a class="role-email" href="mailto:annalyn@mit.edu">annalyn@mit.edu</a>
      </div>

      <div class="qr-wrap">
        <div id="qrcode"></div>
        <p class="site-url">bachmanna1994.github.io</p>
        <button class="copy-btn" id="copyBtn">Copy link</button>
      </div>
    </div>
  </div>
</div>

<script>
  var siteUrl = "https://bachmanna1994.github.io/";

  new QRCode(document.getElementById("qrcode"), {
    text: siteUrl,
    width: 132,
    height: 132,
    colorDark: "#163A4D",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M
  });

  var btn = document.getElementById("copyBtn");
  btn.addEventListener("click", function(){
    navigator.clipboard.writeText(siteUrl).then(function(){
      btn.textContent = "Link copied";
      btn.classList.add("copied");
      setTimeout(function(){
        btn.textContent = "Copy link";
        btn.classList.remove("copied");
      }, 1800);
    });
  });
</script>

</body>
</html>
